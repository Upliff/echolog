<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Echolog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.youtube.com">
<!-- Fonts load without holding up the page. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/style.css?v=10">
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <canvas class="bd-layer" width="32" height="32"></canvas>
  <canvas class="bd-layer" width="32" height="32"></canvas>
  <div class="bd-vignette"></div>
</div>

<header class="top" id="top">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a class="brand" href="#/">Echolog</a>
    <span class="crumb" id="crumb"></span>
  </nav>
  <div class="top-right">
    <button class="about-btn" type="button" id="soundsBtn" aria-expanded="false" aria-controls="soundsPanel" hidden>Sounds</button>
    <button class="about-btn" type="button" id="aboutBtn">About</button>
  </div>
  <div class="sounds" id="soundsPanel" role="group" aria-label="Sounds" hidden></div>
</header>

<main id="app" tabindex="-1"></main>

<div class="stage" id="stage" hidden>
  <div class="layer-music" id="musicWrap"></div>
  <div class="layer-scene" id="sceneWrap"></div>
  <div class="stage-tap" id="stageTap"></div>
  <p class="stage-loading" aria-live="polite">Loading...</p>
  <p class="stage-msg" id="stageMsg" hidden></p>
</div>

<nav class="scenebar" id="sceneBar" aria-label="Scenes" hidden></nav>
<a class="side-btn prev" id="prevBtn" hidden></a>
<a class="side-btn next" id="nextBtn" hidden></a>

<div class="dock" id="dock" hidden>
  <span class="dock-title" id="dockTitle"></span>
  <button class="ctl" type="button" id="dockPlay" aria-label="Pause"></button>
  <button class="ctl" type="button" id="dockUp" aria-label="Back to the video">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div class="upnext" id="upnext" role="status" hidden>
  <span id="upnextText"></span>
  <button type="button" id="upnextGo">Play now</button>
  <button type="button" id="upnextStay">Stay</button>
</div>

<div class="clouds" id="clouds" aria-hidden="true"></div>

<dialog class="about" id="about">
  <p>[ABOUT]</p>
  <form method="dialog"><button type="submit">Close</button></form>
</dialog>

<script src="assets/app.js?v=11" defer></script>
</body>
</html>
