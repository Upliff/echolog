name: Find videos

# Used by the bulk chat: lists YouTube playlists and searches from
# tools/find-request.json and commits the results to tools/found/.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: find-videos
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python tools/find_videos.py
      - name: Commit results
        run: |
          git config user.name "echolog-bot"
          git config user.email "echolog-bot@users.noreply.github.com"
          git add -A tools/found
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Found videos"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
