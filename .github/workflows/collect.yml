name: Collect stories

on:
  schedule:
    - cron: "17 16 * * *"   # daily, about 3am Sydney time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collector/collect.py

      - name: Commit new data
        run: |
          git config user.name "echolog-bot"
          git config user.email "echolog-bot@users.noreply.github.com"
          git add data/stories.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update stories"
            # Someone may have saved in the admin page while this ran: pick that up and try again.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
